<style>
:root{--navy:#101c37;--blue:#3158e7;--light:#eef3ff;--line:#e3e8f2;--ink:#162342;--muted:#61708c;--green:#137b54;--red:#bc3b50;--gold:#ae6d08}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(145deg,#eef3ff,#f8faff 50%,#f5f3ff);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink)}

button{font:inherit;cursor:pointer;border:0;font-weight:750;transition:background .15s,transform .15s}

.btn{border-radius:12px;padding:13px 22px;background:var(--blue);color:white}

.footer{color:#8090aa;text-align:center;margin-top:22px;font-size:12px}

.score{background:var(--navy);color:white;border-radius:20px;padding:19px 24px;text-align:center;min-width:146px}
.score b{font-size:48px;letter-spacing:-.06em}
.score span{font-size:15px;color:#aebce1}
.result-head h2{font-size:clamp(24px,4vw,30px);margin:0 0 7px}
.result-head p{line-height:1.5;color:var(--muted);margin:0}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}

.section-title{font-size:19px;margin:0 0 15px}

.review strong{color:#82550c}
.review small{color:#665a45;display:block;margin-top:4px}
.empty{background:#e9f7ef;color:#11683f;border-radius:13px;padding:17px}
.item{border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-top:10px}

.item summary::-webkit-details-marker{display:none}
.item summary::after{content:"+";margin-left:auto;font-size:20px;font-weight:400}
.item[open] summary::after{content:"−"}
.status{flex:0 0 auto;border-radius:7px;padding:4px 7px;font-size:11px;font-weight:800}
.ok{background:#e5f6ec;color:var(--green)}
.bad{background:#fff0ef;color:var(--red)}
.detail{border-top:1px solid var(--line);padding:15px 17px;line-height:1.62;font-size:14px}
.detail p{margin:5px 0}
.detail .mistake{color:var(--red);font-weight:700}
.detail .correct{color:var(--green);font-weight:750}
.detail .reason{padding:10px 13px;border-radius:10px;background:#f5f7fd;margin-top:11px}
.end-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
@media(max-width:600px){.wrap{padding:12px 11px 45px}header{padding:25px 21px}.panel{padding:22px 19px;margin-top:13px}.btn{padding:13px 16px}.result-head{align-items:stretch}.score{min-width:120px}.question{margin:20px 0}.actions{gap:7px}}
@media print{body{background:white}.wrap{max-width:none}.actions,.jump,.end-actions{display:none}header{box-shadow:none}.item .detail{display:block}.item{break-inside:avoid}}
</style>

nente: divide las bases."},{"id":6,"group":"Potencias","topic":"Cambio de base","kind":"power","html":"Expresa como <strong>una sola potencia de base 2</strong>: <strong>8<sup>4</sup> : 2<sup>7</sup></strong>","answer":32,"shown":"2⁵ (sin calcular)","explain":"Primero transforma 8 en 2³: 8⁴ = (2³)⁴ = 2¹². Después: 2¹² : 2⁷ = 2⁵.","review":"Cambio de base y división de potencias con la misma base."},{"id":7,"group":"Potencias","topic":"Base negativa y potencia de una potencia","kind":"power","html":"Expresa como <strong>una sola potencia</strong>: <strong>[(−2)<sup>3</sup>]<sup>4</sup></strong>","answer":4096,"shown":"(−2)¹² o 2¹² (sin calcular)","explain":"Multiplicas los exponentes: [(−2)³]⁴ = (−2)¹². Como el exponente 12 es par, también equivale a 2¹². Es importante usar paréntesis con una base negativa.","review":"Potencias de base negativa, paréntesis y potencia de una potencia."},{"id":8,"group":"Potencias","topic":"Exponentes negativos","kind":"power","html":"Expresa como <strong>una sola potencia</strong>: <strong>(5<sup>3</sup>)<sup>−2</sup></strong>","answer":0.000064,"shown":"5⁻⁶ o 1/5⁶ (sin calcular)","explain":"Multiplica los exponentes: 3 · (−2) = −6. Por tanto (5³)⁻² = 5⁻⁶ = 1/5⁶. No hace falta calcular el denominador.","review":"Exponentes negativos y potencia de una potencia."},{"id":9,"group":"Raíces","topic":"Raíces cuadradas","kind":"number","html":"Calcula la raíz cuadrada: <strong>√196</strong>","answer":14,"shown":"14","explain":"14² = 196, por tanto √196 = 14.","review":"Cuadrados perfectos y raíces cuadradas."},{"id":10,"group":"Raíces","topic":"Raíces cúbicas negativas","kind":"number","html":"Calcula: <strong>∛(−216)</strong>","answer":-6,"shown":"−6","explain":"(−6)³ = −216. Las raíces de índice impar de números negativos sí existen en los reales.","review":"Cubos perfectos y raíz cúbica de un número negativo."},{"id":11,"group":"Raíces","topic":"Existencia de raíces reales","kind":"choice","html":"¿Existe <strong>√(−49)</strong> entre los números reales?","options":[{"id":"a","label":"Sí, y vale −7"},{"id":"b","label":"Sí, y vale 7"},{"id":"c","label":"No, no existe en los números reales"}],"answer":"c","shown":"No, no existe en los números reales","explain":"Ningún número real elevado al cuadrado da −49: el cuadrado de un número real no es negativo.","review":"Raíces de índice par e impar y signos del radicando."},{"id":12,"group":"Raíces","topic":"Raíz cuarta","kind":"number","html":"Calcula la raíz principal: <strong>⁴√81</strong>","answer":3,"shown":"3","explain":"3⁴ = 81, así que la raíz cuarta principal de 81 es 3. Si resolvieras la ecuación x⁴ = 81, entonces x = ±3.","review":"Potencias y raíces de índice par; diferencia entre raíz principal y ecuación."},{"id":13,"group":"Raíces","topic":"Raíz quinta negativa","kind":"number","html":"Calcula: <strong>⁵√(−32)</strong>","answer":-2,"shown":"−2","explain":"(−2)⁵ = −32. Una raíz de índice impar puede tener un radicando negativo.","review":"Raíces de índice impar con números negativos."},{"id":14,"group":"Decimales","topic":"Ordenación de números decimales","kind":"choice","html":"Ordena <strong>de menor a mayor</strong> los números <strong>2,05; 2,5; 2,005</strong>.","options":[{"id":"a","label":"2,005 < 2,05 < 2,5"},{"id":"b","label":"2,05 < 2,005 < 2,5"},{"id":"c","label":"2,5 < 2,05 < 2,005"}],"answer":"a","shown":"2,005 < 2,05 < 2,5","explain":"Añade ceros para comparar: 2,005; 2,050 y 2,500. Así sabes cuál es menor.","review":"Ordenación de decimales, comparando cifra a cifra."},{"id":15,"group":"Decimales","topic":"Redondeo a las centésimas","kind":"number","html":"Redondea <strong>8,376</strong> a las <strong>centésimas</strong>.","answer":8.38,"shown":"8,38","explain":"Las centésimas son la segunda cifra decimal. La milésima es 6, así que la centésima sube de 7 a 8.","review":"Aproximación decimal por redondeo a las centésimas."},{"id":16,"group":"Decimales","topic":"Suma de decimales","kind":"number","html":"Calcula: <strong>0,95 + 5,4 + 0,025</strong>","answer":6.375,"shown":"6,375","explain":"Alinea las comas y completa ceros: 0,950 + 5,400 + 0,025 = 6,375.","review":"Sumar decimales alineando las comas."},{"id":17,"group":"Decimales","topic":"Resta de decimales","kind":"number","html":"Calcula: <strong>135,2 − 1,352</strong>","answer":133.848,"shown":"133,848","explain":"Escribe 135,200 − 1,352. Después resta: 133,848.","review":"Restar decimales completando con ceros y alineando cifras."},{"id":18,"group":"Decimales","topic":"Multiplicación de decimales","kind":"number","html":"Calcula: <strong>2,6 × 3,01</strong>","answer":7.826,"shown":"7,826","explain":"26 × 301 = 7826. Como los factores tienen tres cifras decimales en total, el producto es 7,826.","review":"Multiplicar decimales contando el total de cifras decimales."},{"id":19,"group":"Decimales","topic":"División de decimales","kind":"number","html":"Calcula: <strong>6 : 2,5</strong>","answer":2.4,"shown":"2,4","explain":"Multiplica dividendo y divisor por 10 para eliminar la coma del divisor: 60 : 25 = 2,4.","review":"División de decimales: quitar la coma del divisor sin cambiar el cociente."},{"id":20,"group":"Decimales","topic":"Multiplicación por 1000","kind":"number","html":"Calcula: <strong>0,048 × 1000</strong>","answer":48,"shown":"48","explain":"Multiplicar por 1000 desplaza la coma tres lugares a la derecha: 0,048 → 48.","review":"Multiplicar decimales por 10, 100 y 1000."}];
var saved=new Array(qs.length).fill("");
var pos=0,finished=false;
var root=document.getElementById("root");
function enc(s){return String(s).replace(/[&<>"']/g,function(x){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]})}
function validNum(s){var t=String(s).trim().replace(/\s+/g,"").replace(",",".").replace("−","-");if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(t))return NaN;return Number(t)}
function norm(s){
var t=String(s).trim().replace(/\s+/g,"").replace(/[−–]/g,"-").replace(/\*\*/g,"^").replace(/,/g,".");
var sup={"⁰":"0","¹":"1","²":"2","³":"3","⁴":"4","⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9","⁻":"-"};
return t.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+/g,function(m){return "^"+Array.from(m).map(function(c){return sup[c]}).join("")});
}
function numEqual(a,b){return Number.isFinite(a)&&Math.abs(a-b)<=1e-9*Math.max(1,Math.abs(b))}
function powerValue(s){
var t=norm(s);
var p=t.match(/^(?:\(([+-]?\d+(?:\.\d+)?)\)|(\d+(?:\.\d+)?))\^\(?([+-]?\d+)\)?$/);
if(p){var base=Number(p[1]!==undefined?p[1]:p[2]),exp=Number(p[3]);if(Math.abs(exp)>35||Math.abs(base)>1e6)return NaN;return Math.pow(base,exp)}
var reciprocal=t.match(/^1\/\(?(\d+)\^(\d+)\)?$/);
if(reciprocal){var b=Number(reciprocal[1]),e=Number(reciprocal[2]);if(b>0&&e<=35)return 1/Math.pow(b,e)}
var fraction=t.match(/^([+-]?\d+)\/([+-]?\d+)$/);
if(fraction&&Number(fraction[2])!==0)return Number(fraction[1])/Number(fraction[2]);
return NaN;
}
function isCorrect(q,answer){
if(String(answer).trim()==="")return false;
if(q.kind==="choice")return answer===q.answer;
var numerical=validNum(answer);
if(numEqual(numerical,q.answer))return true;
if(q.kind==="power")return numEqual(powerValue(answer),q.answer);
return false;
}
function scoreText(points){var s=(points/2).toFixed(1).replace(".",",");return s.endsWith(",0")?s.slice(0,-2):s}
function answeredCount(){return saved.filter(function(a){return a!==""}).length}

if(finished){renderResults();return}
var q=qs[pos],pct=(pos+1)*100/qs.length;

root.innerHTML='<section class="panel"><div class="barline"><span class="micro">Pregunta '+(pos+1)+' de '+qs.length+'</span><span class="micro">'+answeredCount()+' respondidas</span></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="'+qs.length+'" aria-valuenow="'+(pos+1)+'"><div style="width:'+pct+'%"></div></div><span class="tag">'+enc(q.topic)+'</span><div class="question">'+q.html+'</div>'+options+'<div class="note">Cada pregunta vale 0,5 puntos. Puedes volver atrás y cambiar tus respuestas.</div><div class="actions"><button class="btn sec" id="prev" '+(pos===0?'disabled':'')+'>Anterior</button><button class="btn" id="next">'+(pos===qs.length-1?'Corregir examen':'Siguiente')+'</button></div></section><nav class="jump" aria-label="Ir a una pregunta">'+qs.map(function(x,i){return '<button class="dot '+(i===pos?'active ':'')+(saved[i]!==""?'answered':'')+'" data-jump="'+i+'" aria-label="Pregunta '+(i+1)+'">'+(i+1)+'</button>'}).join("")+'</nav>';
if(q.kind==="choice"){root.querySelectorAll('input[name="respuesta"]').forEach(function(el){el.addEventListener("change",function(){saved[pos]=el.value;root.querySelectorAll(".dot").forEach(function(d,i){d.classList.toggle("answered",saved[i]!=="")});root.querySelector(".barline .micro:last-child").textContent=answeredCount()+" respondidas";})})}
else{var inp=document.getElementById("respuesta");inp.addEventListener("input",function(){saved[pos]=inp.value;root.querySelectorAll(".dot").forEach(function(d,i){d.classList.toggle("answered",saved[i]!=="")});root.querySelector(".barline .micro:last-child").textContent=answeredCount()+" respondidas";});inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();advance()}})}

document.getElementById("next").onclick=advance;
root.querySelectorAll("[data-jump]").forEach(function(el){el.onclick=function(){pos=Number(el.getAttribute("data-jump"));render()}});
}
function advance(){if(pos<qs.length-1){pos++;render()}else{finished=true;render();window.scrollTo({top:0,behavior:"smooth"})}}
function renderResults(){
var correct=qs.filter(function(q,i){return isCorrect(q,saved[i])}).length;
var wrong=qs.length-correct;var omitted=saved.filter(function(a){return a===""}).length;
var byTopic={};qs.forEach(function(q,i){if(!isCorrect(q,saved[i])){if(!byTopic[q.group])byTopic[q.group]=[];byTopic[q.group].push(q)}});
var heading=correct>=18?"¡Muy buen resultado!":correct>=14?"¡Vas por buen camino!":correct>=10?"Tienes una buena base para mejorar":"Vamos a reforzar lo importante";
var review=Object.keys(byTopic).length?'<div class="review-list">'+Object.keys(byTopic).map(function(group){return '<div class="review"><strong>'+enc(group)+' · '+byTopic[group].length+' '+(byTopic[group].length===1?'pregunta a revisar':'preguntas a revisar')+'</strong>'+byTopic[group].map(function(q){return '<small>• '+enc(q.review)+'</small>'}).join("")+'</div>'}).join("")+'</div>':'<div class="empty">¡Has acertado todas! No hay errores que repasar en este examen.</div>';
var details=qs.map(function(q,i){var ok=isCorrect(q,saved[i]),user=saved[i]!==""?(q.kind==="choice"?q.options.filter(function(o){return o.id===saved[i]})[0].label:saved[i]):"Sin responder";return '<details class="item" '+(!ok?'open':'')+'><summary><span class="status '+(ok?'ok':'bad')+'">'+(ok?'BIEN':'ERROR')+'</span><span>'+q.id+'. '+enc(q.topic)+'</span></summary><div class="detail"><p><strong>Enunciado:</strong> '+q.html+'</p><p><strong>Tu respuesta:</strong> <span class="'+(ok?'correct':'mistake')+'">'+enc(user)+'</span></p><p><strong>Respuesta correcta:</strong> <span class="correct">'+enc(q.shown)+'</span></p><div class="reason"><strong>Explicación:</strong> '+enc(q.explain)+'</div>'+(ok?'':'<p><strong>Repasa:</strong> '+enc(q.review)+'</p>')+'</div></details>'}).join("");
root.innerHTML='<section class="panel"><div class="result-head"><div><span class="tag">Examen corregido</span><h2 style="margin-top:15px">'+heading+'</h2><p>Estas son tus respuestas y lo que debes repasar antes del examen.</p></div><div class="score"><b>'+scoreText(correct)+'</b><span> / 10</span><div style="font-size:12px;color:#c9d4f4;margin-top:2px">TU NOTA</div></div></div><div class="kpis"><div class="kpi"><strong>'+correct+'</strong>aciertos</div><div class="kpi"><strong>'+wrong+'</strong>errores o sin responder</div><div class="kpi"><strong>'+omitted+'</strong>sin responder</div></div></section><section class="panel"><h3 class="section-title">Qué necesitas repasar</h3>'+review+'</section><section class="panel"><h3 class="section-title">Corrección de las 20 preguntas</h3><p class="micro" style="margin:0 0 12px">Abre o cierra cada pregunta para ver su explicación.</p>'+details+'<div class="end-actions"><button class="btn" id="retry">Repetir examen</button><button class="btn sec" id="print">Imprimir resultados</button></div></section>';
document.getElementById("retry").onclick=function(){saved=new Array(qs.length).fill("");pos=0;finished=false;render();window.scrollTo({top:0,behavior:"smooth"})};
document.getElementById("print").onclick=function(){window.print()};
}
render();
})();
</script>
